<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Progress</title>
<meta name="theme-color" content="#162326">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f4;--ink:#172025;--muted:#66727a;--line:#dce2e4;--panel:#fff;--accent:#0f766e;--danger:#b91c1c;--good:#15803d;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}header{position:sticky;top:0;z-index:5;background:#162326;color:white;padding:14px 16px}h1{margin:0;font-size:22px}.meta{color:var(--muted);font-size:13px}header .meta{color:#b8c6ca}.tabs{display:flex;gap:8px;overflow:auto;margin-top:12px}.tabs button{white-space:nowrap;background:#22383d;color:#eaf1f3;border:1px solid #36575e}.tabs button.active{background:#0f766e;border-color:#0f766e}main{padding:14px;display:grid;gap:14px}.view{display:none}.view.active{display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}.stat{padding:12px}.stat label{font-size:12px;color:var(--muted);display:block}.stat strong{font-size:24px}.panel h2{font-size:16px;margin:0;padding:12px;border-bottom:1px solid var(--line)}.body{padding:12px;display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:7px;min-height:38px;padding:8px;background:white;color:var(--ink)}button{cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.danger{color:var(--danger);border-color:#f2c4c4}.table{overflow:auto;background:white;border:1px solid var(--line);border-radius:8px}table{border-collapse:separate;border-spacing:0;min-width:1180px;width:100%}th,td{border-bottom:1px solid var(--line);padding:7px;text-align:left;font-size:13px}th{position:sticky;top:0;background:#eef4f6;z-index:1}td input,td select{min-height:34px;padding:5px;min-width:70px}.exercise{min-width:190px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color:var(--muted);white-space:nowrap}.good{color:var(--good)}.warn{color:var(--warn)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{padding:12px}.card h3{margin:0 0 5px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px}.quick{display:grid;gap:7px;max-height:310px;overflow:auto}.quick button{text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap}.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eef4f6;border-radius:6px}textarea{min-height:110px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<header><h1>Gym Progress</h1><p class="meta"><span id="todayText"></span> · <span id="saveStatus">自動儲存已開啟</span></p><div class="tabs"><button class="active" data-view="today">今日訓練</button><button data-view="progress">進步追蹤</button><button data-view="physique">體態</button><button data-view="library">動作庫</button><button data-view="backup">備份</button></div></header>
<main>
<section id="today" class="view active">
<div class="stats"><div class="stat"><label>今日容量</label><strong id="vol">0</strong></div><div class="stat"><label>動作</label><strong id="exCount">0</strong></div><div class="stat"><label>PR</label><strong id="prCount">0</strong></div><div class="stat"><label>力竭</label><strong id="failCount">0</strong></div></div>
<div class="panel"><h2>今日狀態</h2><div class="body"><div class="row"><select id="type"><option>Push</option><option>Pull</option><option>Legs</option><option>Upper Day</option><option>Lower Day</option><option>有氧</option><option>加強訓練</option><option>Rest / Recovery</option></select><select id="energy"><option value="">精神狀態</option><option>1 很差</option><option>2 偏累</option><option>3 普通</option><option>4 不錯</option><option>5 很好</option></select></div><div class="row"><input id="weight" type="number" step="0.1" placeholder="體重 kg"><input id="sleep" type="number" step="0.5" placeholder="睡眠 hr"></div><div class="actions"><button class="primary" id="addBlank">新增空白動作</button><button id="addCardio">新增有氧列</button><button id="copyLast">載入上次訓練</button></div></div></div>
<div class="panel"><h2>快速新增常用動作</h2><div class="body"><input id="search" placeholder="搜尋 Bench / Row / Squat / 慢跑"><div id="quick" class="quick"></div></div></div>
<div class="table"><table><thead><tr><th>動作</th><th>Warm kg</th><th>Warm reps</th><th>Set1 kg</th><th>Set1 reps</th><th>Set2 kg</th><th>Set2 reps</th><th>Set3 kg</th><th>Set3 reps</th><th>Set4 kg</th><th>Set4 reps</th><th>Set5 kg</th><th>Set5 reps</th><th>距離 km</th><th>時間 min</th><th>坡度 %</th><th>RPE</th><th>PR</th><th>力竭</th><th>建議</th><th>容量</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section id="progress" class="view"><div class="stats"><div class="stat"><label>本週天數</label><strong id="wDays">0</strong></div><div class="stat"><label>本週容量</label><strong id="wVol">0</strong></div><div class="stat"><label>本週 PR</label><strong id="wPr">0</strong></div><div class="stat"><label>本週力竭</label><strong id="wFail">0</strong></div></div><div class="panel"><h2>動作歷史</h2><div class="body"><select id="historySelect"></select><div id="history" class="grid"></div></div></div></section>
<section id="physique" class="view"><div class="panel"><h2>新增今日體態</h2><div class="body"><div class="row"><input id="cw" type="number" step="0.1" placeholder="體重 kg"><input id="waist" type="number" step="0.1" placeholder="腰圍 cm"></div><select id="angle"><option>正面</option><option>側面</option><option>背面</option><option>浴室鏡子</option><option>健身房鏡子</option></select><input id="photo" type="file" accept="image/*"><button class="primary" id="savePhoto">儲存體態</button></div></div><div id="photos" class="grid"></div></section>
<section id="library" class="view"><div class="actions"><button class="primary" id="addExercise">新增動作</button></div><div id="lib" class="grid"></div></section>
<section id="backup" class="view"><div class="panel"><h2>資料備份</h2><div class="body"><button class="primary" id="export">下載 JSON</button><textarea id="exportBox" placeholder="匯出資料"></textarea><textarea id="importBox" placeholder="貼上 JSON 匯入"></textarea><div class="actions"><button id="import">匯入</button><button class="danger" id="reset">清空本機資料</button></div></div></div></section>
</main>
<script>
const $=s=>document.querySelector(s),KEY='gym-progress-v3',oldKey='gym-progress-v2',today=()=>new Date().toISOString().slice(0,10),id=()=>Math.random().toString(36).slice(2,9),n=v=>Number(v||0);
const base=['Bench Press|Chest|Barbell','Incline Dumbbell Press|Chest|Dumbbell','Machine Chest Press|Chest|Machine','Cable Fly|Chest|Cable','Lat Pulldown|Back|Cable','Seated Cable Row|Back|Cable','Chest Supported Row|Back|Machine','Straight Arm Pulldown|Back|Cable','Dumbbell Shoulder Press|Shoulders|Dumbbell','Cable Lateral Raise|Shoulders|Cable','Dumbbell Lateral Raise|Shoulders|Dumbbell','Rear Delt Fly|Shoulders|Machine','Leg Press|Quads|Machine','Squat|Quads|Barbell','Leg Extension|Quads|Machine','Leg Curl|Hamstrings|Machine','Romanian Deadlift|Hamstrings|Barbell','Calf Raise|Calves|Machine','EZ Bar Curl|Biceps|EZ Bar','Dumbbell Curl|Biceps|Dumbbell','Triceps Pushdown|Triceps|Cable','Overhead Triceps Extension|Triceps|Cable','慢跑|Cardio|Outdoor / Treadmill','跑步機爬坡|Cardio|Treadmill','樓梯機|Cardio|Machine'].map(x=>{let[a,b,c]=x.split('|');return{id:id(),name:a,muscle:b,equipment:c}});
let state=load();function load(){let raw=localStorage.getItem(KEY)||localStorage.getItem(oldKey);let s=raw?JSON.parse(raw):{exercises:base,workouts:[],entries:[],photos:[]};s.exercises=s.exercises||base;s.workouts=s.workouts||[];s.entries=s.entries||[];s.photos=s.photos||[];base.forEach(b=>{if(!s.exercises.some(e=>e.name===b.name))s.exercises.push(b)});s.entries.forEach(e=>['distance','minutes','incline'].forEach(f=>{if(e[f]==null)e[f]=''}));return s}
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='已自動記錄 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function workout(){let w=state.workouts.find(x=>x.date===today());if(!w){w={id:id(),date:today(),type:'Push',weight:'',sleep:'',energy:''};state.workouts.push(w);for(let i=1;i<=3;i++)state.entries.push(blank(w.id,i));save()}return w}
function blank(wid,order,ex=''){return{id:id(),wid,date:today(),order,ex,wkg:'',wr:'',s1kg:'',s1r:'',s2kg:'',s2r:'',s3kg:'',s3r:'',s4kg:'',s4r:'',s5kg:'',s5r:'',distance:'',minutes:'',incline:'',rpe:'',pr:false,fail:false,suggest:''}}
function volume(e){return [1,2,3,4,5].reduce((a,i)=>a+n(e['s'+i+'kg'])*n(e['s'+i+'r']),0)}function oneRM(e){return Math.max(0,...[1,2,3,4,5].map(i=>n(e['s'+i+'kg'])*(1+n(e['s'+i+'r'])/30)))}function ename(x){return state.exercises.find(e=>e.id===x)?.name||''}function cardioId(){return state.exercises.find(e=>e.name==='慢跑')?.id||''}
function rep(e,f){let o='<option value="">-</option>';for(let i=1;i<=30;i++)o+=`<option value="${i}" ${String(e[f])===String(i)?'selected':''}>${i}</option>`;return `<select data-f="${f}">${o}</select>`}function cell(e,f,step='0.5'){return `<input type="number" step="${step}" data-f="${f}" value="${e[f]||''}">`}function exsel(e){return `<select class="exercise" data-f="ex"><option value="">選動作</option>${state.exercises.map(x=>`<option value="${x.id}" ${e.ex===x.id?'selected':''}>${x.name}</option>`).join('')}</select>`}
function renderRows(){let w=workout(),list=state.entries.filter(e=>e.wid===w.id).sort((a,b)=>a.order-b.order);$('#rows').innerHTML=list.length?list.map(e=>`<tr data-id="${e.id}"><td>${exsel(e)}</td><td>${cell(e,'wkg')}</td><td>${rep(e,'wr')}</td><td>${cell(e,'s1kg')}</td><td>${rep(e,'s1r')}</td><td>${cell(e,'s2kg')}</td><td>${rep(e,'s2r')}</td><td>${cell(e,'s3kg')}</td><td>${rep(e,'s3r')}</td><td>${cell(e,'s4kg')}</td><td>${rep(e,'s4r')}</td><td>${cell(e,'s5kg')}</td><td>${rep(e,'s5r')}</td><td>${cell(e,'distance','0.1')}</td><td>${cell(e,'minutes','1')}</td><td>${cell(e,'incline','0.5')}</td><td>${cell(e,'rpe','0.5')}</td><td><input type="checkbox" data-f="pr" ${e.pr?'checked':''}></td><td><input type="checkbox" data-f="fail" ${e.fail?'checked':''}></td><td><select data-f="suggest"><option></option>${['下次加重','下次加次數','下次維持','姿勢先修正','降低重量','下次增加時間','下次增加距離'].map(s=>`<option ${e.suggest===s?'selected':''}>${s}</option>`).join('')}</select></td><td><span class="pill">${Math.round(volume(e))}</span></td><td><button class="danger" data-del="${e.id}">刪除</button></td></tr>`).join(''):`<tr><td colspan="22">按上面新增動作開始記錄。</td></tr>`}
function weekStart(d){let x=new Date(d+'T00:00:00'),day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}function renderStats(){let w=workout(),es=state.entries.filter(e=>e.wid===w.id),we=state.entries.filter(e=>weekStart(e.date)===weekStart(today()));$('#vol').textContent=Math.round(es.reduce((a,e)=>a+volume(e),0));$('#exCount').textContent=es.filter(e=>e.ex).length;$('#prCount').textContent=es.filter(e=>e.pr).length;$('#failCount').textContent=es.filter(e=>e.fail).length;$('#wDays').textContent=new Set(we.map(e=>e.date)).size;$('#wVol').textContent=Math.round(we.reduce((a,e)=>a+volume(e),0));$('#wPr').textContent=we.filter(e=>e.pr).length;$('#wFail').textContent=we.filter(e=>e.fail).length}
function renderQuick(){let q=$('#search').value.toLowerCase();$('#quick').innerHTML=state.exercises.filter(e=>e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q)||e.equipment.toLowerCase().includes(q)).map(e=>`<button data-add="${e.id}"><b>${e.name}</b><br><span class="meta">${e.muscle} · ${e.equipment}</span></button>`).join('')}function renderHistory(){let sel=$('#historySelect');let cur=sel.value;sel.innerHTML=state.exercises.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');let ex=cur||state.exercises[0]?.id;sel.value=ex;let list=state.entries.filter(e=>e.ex===ex).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);$('#history').innerHTML=list.length?list.map(e=>`<div class="card"><h3>${e.date}</h3><p>${ename(e.ex)}</p><p>Volume ${Math.round(volume(e))} · 1RM ${oneRM(e).toFixed(1)}</p><p>${e.distance||e.minutes?`${e.distance||0} km / ${e.minutes||0} min · 坡度 ${e.incline||0}%`:''}</p><p>${e.pr?'<span class="pill good">PR</span> ':''}${e.fail?'<span class="pill warn">Failure</span>':''}</p></div>`).join(''):'<div class="card"><p>還沒有紀錄</p></div>'}
function renderPhotos(){$('#photos').innerHTML=state.photos.length?state.photos.slice().reverse().map(p=>`<div class="card photo">${p.img?`<img src="${p.img}">`:''}<h3>${p.title}</h3><p>${p.date} · ${p.weight||'未填'} kg · ${p.angle}</p></div>`).join(''):'<div class="card"><p>還沒有體態紀錄</p></div>'}function renderLib(){$('#lib').innerHTML=state.exercises.map(e=>`<div class="card"><h3>${e.name}</h3><p>${e.muscle} · ${e.equipment}</p></div>`).join('')}function render(){let w=workout();$('#todayText').textContent=w.date+' · '+w.type;$('#type').value=w.type;$('#weight').value=w.weight||'';$('#sleep').value=w.sleep||'';$('#energy').value=w.energy||'';renderRows();renderStats();renderQuick();renderHistory();renderPhotos();renderLib()}
$('.tabs').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');render()});$('#rows').addEventListener('input',edit);$('#rows').addEventListener('change',edit);function edit(e){let tr=e.target.closest('tr'),it=state.entries.find(x=>x.id===tr?.dataset.id),f=e.target.dataset.f;if(!it||!f)return;it[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();renderStats();renderHistory()}$('#rows').addEventListener('click',e=>{let d=e.target.dataset.del;if(!d)return;state.entries=state.entries.filter(x=>x.id!==d);save();render()});$('#type').addEventListener('change',e=>{workout().type=e.target.value;save();render()});['weight','sleep','energy'].forEach(k=>$('#'+k).addEventListener('input',()=>{let w=workout();w.weight=$('#weight').value;w.sleep=$('#sleep').value;w.energy=$('#energy').value;save()}));$('#addBlank').addEventListener('click',()=>{let w=workout();state.entries.push(blank(w.id,state.entries.filter(e=>e.wid===w.id).length+1));save();render()});$('#addCardio').addEventListener('click',()=>{let w=workout();w.type='有氧';state.entries.push(blank(w.id,state.entries.filter(e=>e.wid===w.id).length+1,cardioId()));save();render()});$('#quick').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let w=workout();state.entries.push(blank(w.id,state.entries.filter(e=>e.wid===w.id).length+1,b.dataset.add));save();render()});$('#search').addEventListener('input',renderQuick);$('#copyLast').addEventListener('click',()=>{let old=state.workouts.filter(w=>w.date!==today()).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!old)return;let w=workout();state.entries=state.entries.filter(e=>e.wid!==w.id);state.entries.filter(e=>e.wid===old.id).forEach((e,i)=>state.entries.push(blank(w.id,i+1,e.ex)));save();render()});$('#historySelect').addEventListener('change',renderHistory);$('#savePhoto').addEventListener('click',()=>{let f=$('#photo').files[0],done=img=>{state.photos.push({id:id(),title:'Day '+String(state.photos.length+1).padStart(3,'0'),date:today(),weight:$('#cw').value,waist:$('#waist').value,angle:$('#angle').value,img});save();render()};if(!f)return done('');let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)});$('#addExercise').addEventListener('click',()=>{let name=prompt('動作名稱');if(!name)return;state.exercises.push({id:id(),name,muscle:prompt('肌群','Chest')||'',equipment:prompt('器材','Dumbbell')||''});save();render()});$('#export').addEventListener('click',()=>{let j=JSON.stringify(state,null,2);$('#exportBox').value=j;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='gym-progress-'+today()+'.json';a.click()});$('#import').addEventListener('click',()=>{try{let x=JSON.parse($('#importBox').value);if(!x.exercises||!x.workouts||!x.entries)throw Error();state=x;save();render()}catch{alert('匯入失敗')}});$('#reset').addEventListener('click',()=>{if(confirm('確定清空本機資料？')){localStorage.removeItem(KEY);localStorage.removeItem(oldKey);location.reload()}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));render();
</script>
</body>
</html>
